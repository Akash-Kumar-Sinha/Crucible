version: "3.8"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: crucible-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  uptime-kuma-data:
    name: crucible-uptime-kuma-data
