apiVersion: v1
kind: Service
metadata:
  name: crucible-orchestrator
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-orchestrator
    app.kubernetes.io/part-of: crucible
spec:
  ports:
    - port: 4000
      name: http
      targetPort: 4000
  selector:
    app.kubernetes.io/name: crucible-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crucible-orchestrator
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-orchestrator
    app.kubernetes.io/part-of: crucible
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crucible-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible-orchestrator
        app.kubernetes.io/part-of: crucible
    spec:
      serviceAccountName: crucible-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: crucible-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: crucible-config
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crucible-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 4
            failureThreshold: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspace
          emptyDir: {}
