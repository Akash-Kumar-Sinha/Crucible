apiVersion: v1
kind: ConfigMap
metadata:
  name: crucible-config
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-config
    app.kubernetes.io/part-of: crucible
data:
  PORT: "4000"
  HOST: "0.0.0.0"
  CRUCIBLE_EXECUTOR: "k8s"
  CRUCIBLE_K8S_NAMESPACE: "crucible"
  CRUCIBLE_GRPC_ADDR: "crucible-executor-grpc:50051"
  REDIS_URL: "redis://crucible-redis:6379"
  DATABASE_URL: "postgresql://crucible:crucible_secret@crucible-postgres:5432/crucible?schema=public"
  OPENROUTER_MODEL: "openrouter/free"
  ORCHESTRATOR_URL: "http://crucible-orchestrator:4000"
  NEXT_PUBLIC_ORCHESTRATOR_URL: "http://localhost:4000"
  NEXT_PUBLIC_STREAM_URL: "http://localhost:4000/stream"
