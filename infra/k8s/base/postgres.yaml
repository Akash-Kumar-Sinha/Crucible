apiVersion: v1
kind: Service
metadata:
  name: crucible-postgres
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-postgres
    app.kubernetes.io/part-of: crucible
spec:
  ports:
    - port: 5432
      name: postgres
      targetPort: 5432
  clusterIP: None
  selector:
    app.kubernetes.io/name: crucible-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crucible-postgres
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-postgres
    app.kubernetes.io/part-of: crucible
spec:
  serviceName: crucible-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crucible-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible-postgres
        app.kubernetes.io/part-of: crucible
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_USER
              value: "crucible"
            - name: POSTGRES_DB
              value: "crucible"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crucible-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - crucible
                - -d
                - crucible
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - crucible
                - -d
                - crucible
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
