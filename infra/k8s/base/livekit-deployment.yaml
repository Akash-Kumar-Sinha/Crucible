apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server
  namespace: crucible
  labels:
    app.kubernetes.io/name: livekit-server
    app.kubernetes.io/part-of: crucible
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit-server
          image: livekit/livekit-server:v1.8.3
          args: ["--config", "/etc/livekit/livekit.yaml"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http-signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: crucible-secrets
                  key: LIVEKIT_API_SECRET
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-server
  namespace: crucible
  labels:
    app.kubernetes.io/name: livekit-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: livekit-server
  ports:
    - name: http-signal
      port: 7880
      targetPort: 7880
      protocol: TCP
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
