apiVersion: v1
kind: Service
metadata:
  name: crucible-redis
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-redis
    app.kubernetes.io/part-of: crucible
spec:
  ports:
    - port: 6379
      name: redis
      targetPort: 6379
  selector:
    app.kubernetes.io/name: crucible-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crucible-redis
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-redis
    app.kubernetes.io/part-of: crucible
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crucible-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible-redis
        app.kubernetes.io/part-of: crucible
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
