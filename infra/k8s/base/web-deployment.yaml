apiVersion: v1
kind: Service
metadata:
  name: crucible-web
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-web
    app.kubernetes.io/part-of: crucible
spec:
  ports:
    - port: 3000
      name: http
      targetPort: 3000
  selector:
    app.kubernetes.io/name: crucible-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crucible-web
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-web
    app.kubernetes.io/part-of: crucible
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crucible-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible-web
        app.kubernetes.io/part-of: crucible
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: crucible-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: ORCHESTRATOR_URL
              value: "http://crucible-orchestrator:4000"
            - name: NEXT_PUBLIC_ORCHESTRATOR_URL
              value: "http://localhost:4000"
            - name: NEXT_PUBLIC_STREAM_URL
              value: "http://localhost:4000/stream"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 4
            failureThreshold: 15
