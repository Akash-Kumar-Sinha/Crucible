apiVersion: v1
kind: ServiceAccount
metadata:
  name: crucible-orchestrator
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-orchestrator
    app.kubernetes.io/part-of: crucible
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crucible-orchestrator-job-runner
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-orchestrator
    app.kubernetes.io/part-of: crucible
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crucible-orchestrator-job-runner-binding
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-orchestrator
    app.kubernetes.io/part-of: crucible
subjects:
  - kind: ServiceAccount
    name: crucible-orchestrator
    namespace: crucible
roleRef:
  kind: Role
  name: crucible-orchestrator-job-runner
  apiGroup: rbac.authorization.k8s.io
