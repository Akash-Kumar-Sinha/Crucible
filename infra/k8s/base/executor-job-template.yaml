apiVersion: batch/v1
kind: Job
metadata:
  name: crucible-executor-job-template
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-job
    app.kubernetes.io/part-of: crucible
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible-job
        app.kubernetes.io/part-of: crucible
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor-runner
          image: crucible-sandbox-node:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "echo 'Crucible sandbox task initialized' && touch /var/run/crucible/done"
          workingDir: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: ipc-pipe
              mountPath: /var/run/crucible
        - name: observability-sidecar
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "while [ ! -f /var/run/crucible/done ]; do sleep 1; done"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: ipc-pipe
              mountPath: /var/run/crucible
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: ipc-pipe
          emptyDir: {}
