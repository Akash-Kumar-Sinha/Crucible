apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crucible-ingress
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible-ingress
    app.kubernetes.io/part-of: crucible
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-header: "X-Accel-Buffering no"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: crucible-orchestrator
                port:
                  number: 4000
          - path: /stream
            pathType: Prefix
            backend:
              service:
                name: crucible-orchestrator
                port:
                  number: 4000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: crucible-orchestrator
                port:
                  number: 4000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: crucible-orchestrator
                port:
                  number: 4000
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: crucible-orchestrator
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crucible-web
                port:
                  number: 3000
