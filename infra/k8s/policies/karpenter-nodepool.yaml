apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: crucible-burst-compute
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/part-of: crucible
    app.kubernetes.io/component: autoscaler
spec:
  template:
    metadata:
      labels:
        crucible.io/workload: burst-compute
        crucible.io/role: sandbox-runner
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: crucible-node-class
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
      taints:
        - key: crucible.io/sandbox
          value: "true"
          effect: NoSchedule
      expireAfter: 720h
      terminationGracePeriod: 48h
  limits:
    cpu: "200"
    memory: 400Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: crucible-node-class
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/part-of: crucible
spec:
  amiFamily: AL2023
  role: "KarpenterNodeRole-crucible"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "crucible-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "crucible-cluster"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
