apiVersion: v1
kind: ResourceQuota
metadata:
  name: crucible-tenant-quota
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/part-of: crucible
    app.kubernetes.io/component: tenant-bulkhead
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    count/jobs.batch: "20"
    requests.storage: 50Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: crucible-tenant-limits
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/part-of: crucible
    app.kubernetes.io/component: tenant-bulkhead
spec:
  limits:
    - type: Container
      default:
        cpu: 1000m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 4000m
        memory: 8Gi
      min:
        cpu: 50m
        memory: 64Mi
