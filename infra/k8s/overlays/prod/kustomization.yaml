apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crucible-prod

bases:
  - ../../base

resources:
  - ../../policies/resource-quota.yaml
  - ../../policies/network-policy.yaml
  - ../../policies/autoscaling.yaml
  - ../../policies/karpenter-nodepool.yaml

patchesStrategicMerge:
  - patch-prod.yaml

generatorOptions:
  disableNameSuffixHash: true
