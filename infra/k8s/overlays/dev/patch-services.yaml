apiVersion: v1
kind: Service
metadata:
  name: crucible-web
  namespace: crucible
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: crucible-orchestrator
  namespace: crucible
spec:
  type: NodePort
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
---
apiVersion: v1
kind: Service
metadata:
  name: crucible-executor-grpc
  namespace: crucible
spec:
  type: NodePort
  ports:
    - port: 50051
      targetPort: 50051
      nodePort: 30051
