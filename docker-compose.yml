services:
  postgres:
    image: postgres:16-alpine
    container_name: crucible-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crucible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crucible_secret}
      POSTGRES_DB: ${POSTGRES_DB:-crucible}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crucible} -d ${POSTGRES_DB:-crucible}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - crucible_network

  redis:
    image: redis:7-alpine
    container_name: crucible-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - crucible_network

  executor-grpc:
    build:
      context: .
      dockerfile: infra/docker/executor-grpc.Dockerfile
    container_name: crucible-executor-grpc
    restart: unless-stopped
    environment:
      CRUCIBLE_GRPC_PORT: 50051
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${CRUCIBLE_GRPC_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - crucible_network

  orchestrator:
    build:
      context: .
      dockerfile: infra/docker/orchestrator.Dockerfile
    container_name: crucible-orchestrator
    restart: unless-stopped
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      DATABASE_URL: postgresql://${POSTGRES_USER:-crucible}:${POSTGRES_PASSWORD:-crucible_secret}@postgres:5432/${POSTGRES_DB:-crucible}?schema=public
      REDIS_URL: redis://redis:6379
      CRUCIBLE_EXECUTOR: grpc
      CRUCIBLE_GRPC_ADDR: executor-grpc:50051
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      executor-grpc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 8s
    networks:
      - crucible_network

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: crucible-web
    restart: unless-stopped
    environment:
      PORT: 3000
      ORCHESTRATOR_URL: http://orchestrator:4000
      NEXT_PUBLIC_ORCHESTRATOR_URL: http://localhost:${PORT:-4000}
      NEXT_PUBLIC_STREAM_URL: http://localhost:${PORT:-4000}/stream
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 8s
    networks:
      - crucible_network

volumes:
  postgres_data:
  redis_data:

networks:
  crucible_network:
    driver: bridge
